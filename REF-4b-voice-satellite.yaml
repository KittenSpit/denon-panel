          text: !lambda 'return std::string(id(language)==0 ? "< Retour" : "< Back");'
      - lvgl.label.update:
          id: lbl_settings_title
          text: !lambda 'return std::string(id(language)==0 ? "Parametres" : "Settings");'
      - lvgl.label.update:
          id: lbl_brightness_title
          text: !lambda 'return std::string(id(language)==0 ? "Luminosite" : "Brightness");'
      - lvgl.label.update:
          id: lbl_ww_title
          text: !lambda 'return std::string(id(language)==0 ? "Sensibilite WW" : "Wake Word");'
      - lvgl.label.update:
          id: lbl_ww_val
          text: !lambda 'return std::string(id(language)==0 ? "50% (YAML)" : "50% (in YAML)");'
      - lvgl.label.update:
