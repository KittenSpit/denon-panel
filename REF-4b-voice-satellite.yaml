      - lvgl.label.update:
          id: lbl_status
          text: !lambda 'return std::string(id(language)==0 ? "En veille" : "Standby");'

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    name: "Button Vol Down"
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: |-
          float v = id(speaker_volume) - 0.1f;
          if (v < 0.1f) v = 0.1f;
          id(speaker_volume) = v;
          id(es8311_codec).set_volume(v);
          id(number_volume).publish_state(v * 100.0f);
          ESP_LOGI("volume", "Vol Down -> %.0f%%", v * 100);
      - lvgl.arc.update:
          id: arc_volume
          value: !lambda 'return (int)(id(speaker_volume) * 100);'
      - lvgl.label.update:
          id: lbl_volume_pct
          text: !lambda 'return to_string((int)(id(speaker_volume) * 100)) + "%";'
  - platform: gpio
    pin:
      pca9554: expander
      number: 4
      mode:
        input: true
      inverted: true
    name: "Button Vol Up"
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: |-
          float v = id(speaker_volume) + 0.1f;
          if (v > 1.0f) v = 1.0f;
          id(speaker_volume) = v;
          id(es8311_codec).set_volume(v);
          id(number_volume).publish_state(v * 100.0f);
          ESP_LOGI("volume", "Vol Up -> %.0f%%", v * 100);
      - lvgl.arc.update:
          id: arc_volume
          value: !lambda 'return (int)(id(speaker_volume) * 100);'
      - lvgl.label.update:
          id: lbl_volume_pct
          text: !lambda 'return to_string((int)(id(speaker_volume) * 100)) + "%";'

micro_wake_word:
  id: mww
  models:
    - model: hey_jarvis
      probability_cutoff: 0.5
    - model: okay_nabu
      probability_cutoff: 0.5
  on_wake_word_detected:
    - lambda: |-
        id(last_touch_ms) = millis();
        if (!id(screen_on)) {
          id(screen_on) = true;
          auto call = id(display_backlight).make_call();
          call.set_state(true);
          call.set_brightness(id(screen_brightness));
          call.perform();
        }
        id(is_listening) = true;
        lv_obj_clear_flag(id(bar_listening), LV_OBJ_FLAG_HIDDEN);
    - lvgl.label.update:
        id: lbl_status
        text: !lambda 'return std::string(id(language)==0 ? "Mot-cle !" : "Wake word!");'
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: board_mic
  speaker: board_speaker
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 4.0
  on_client_connected:
    - lvgl.label.update:
        id: lbl_status
        text: !lambda 'return std::string(id(language)==0 ? "En veille" : "Standby");'
    - if:
        condition:
          lambda: 'return id(switch_microphone).state;'
        then:
          - micro_wake_word.start:
              id: mww
  on_client_disconnected:
    - lvgl.label.update:
        id: lbl_status
        text: !lambda 'return std::string(id(language)==0 ? "Déconnecté" : "Disconnected");'
    - micro_wake_word.stop:
        id: mww
    - voice_assistant.stop:
  on_listening:
    - lambda: |-
        id(is_listening) = true;
        lv_obj_clear_flag(id(bar_listening), LV_OBJ_FLAG_HIDDEN);
    - lvgl.label.update:
        id: lbl_status
        text: !lambda 'return std::string(id(language)==0 ? "En ecoute..." : "Listening...");'
  on_tts_stream_start:
    - lambda: |-
        id(is_listening) = false;
        lv_obj_add_flag(id(bar_listening), LV_OBJ_FLAG_HIDDEN);
    - lvgl.label.update:
        id: lbl_status
        text: !lambda 'return std::string(id(language)==0 ? "Repond..." : "Answering...");'
    # Libère le bus I2S pour le speaker (mic et speaker partagent le même bus)
    - micro_wake_word.stop:
        id: mww
    - lambda: |-
        id(es8311_codec).set_volume(id(speaker_volume));
    - audio_dac.mute_off:
        id: es8311_codec
  on_tts_stream_end:
    - lvgl.label.update:
        id: lbl_status
        text: !lambda 'return std::string(id(language)==0 ? "En veille" : "Standby");'
  on_end:
    - lambda: |-
        id(is_listening) = false;
        lv_obj_add_flag(id(bar_listening), LV_OBJ_FLAG_HIDDEN);
    - lvgl.label.update:
        id: lbl_status
        text: !lambda 'return std::string(id(language)==0 ? "En veille" : "Standby");'
  on_idle:
    - if:
        condition:
          lambda: 'return id(switch_microphone).state;'
        then:
          - micro_wake_word.start:
              id: mww
  on_error:
    - lambda: |-
        id(is_listening) = false;
        lv_obj_add_flag(id(bar_listening), LV_OBJ_FLAG_HIDDEN);
    - lvgl.label.update:
        id: lbl_status
        text: !lambda 'return std::string(id(language)==0 ? "Erreur" : "Error");'
    - delay: 1000ms
    - if:
        condition:
          lambda: 'return id(switch_microphone).state;'
        then:
          - micro_wake_word.start:
              id: mww

# I2C — TCA9554 IO expander (0x20) + GT911 touch (0x14)
i2c:
  - id: bus_a
    sda: GPIO47
    scl: GPIO48
    frequency: 100kHz

# IO expander TCA9554 : SPI init display (pins 0/1/2)
pca9554:
  - id: expander
    i2c_id: bus_a
    address: 0x20

# SPI software via TCA9554 pour init ST7701S
# CS=EXIO0, SDA/MOSI=EXIO1, SCL/CLK=EXIO2
spi:
  - id: display_spi
    interface: software
    clk_pin:
      pca9554: expander
      number: 2
      id: lcd_spi_clk
    mosi_pin:
      pca9554: expander
      number: 1
      id: lcd_spi_mosi

# Backlight GPIO4 via LEDC
output:
  - platform: ledc
    pin: GPIO4
    id: backlight_pwm
    frequency: 5000Hz
    inverted: true
  - platform: gpio
    id: speaker_amp_enable
    pin:
      pca9554: expander
      number: 3
      mode:
        output: true

light:
  - platform: monochromatic
    name: "Display Backlight"
    id: display_backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 1s

# Touch GT911 via I2C (pas de reset/interrupt hardware sur ce board)
touchscreen:
  - platform: gt911
    id: touch_panel
    i2c_id: bus_a
    display: lcd_display
    address: 0x14
    update_interval: 20ms
    on_touch:
      - lambda: |-
          if (!id(switch_touchscreen).state) return;
          id(last_touch_ms) = millis();
          if (!id(screen_on)) {
            id(screen_on) = true;
            auto call = id(display_backlight).make_call();
            call.set_state(true);
            call.set_brightness(id(screen_brightness));
            call.perform();
          }

sensor:
  - platform: wifi_signal
    id: wifi_signal_db
    update_interval: 30s
    internal: true
    on_value:
      - lvgl.label.update:
          id: lbl_wifi
          text: !lambda |-
            if (x > -50) return std::string("WiFi +++");
            if (x > -70) return std::string("WiFi ++-");
            return std::string("WiFi ---");

text_sensor:
  - platform: wifi_info
    ssid:
      id: wifi_ssid
      internal: true
      on_value:
        - lvgl.label.update:
            id: lbl_settings_ssid
            text: !lambda 'return "WiFi: " + x;'
    ip_address:
      id: wifi_ip
      internal: true
      on_value:
        - lvgl.label.update:
            id: lbl_settings_ip
            text: !lambda 'return "IP: " + x;'

select:
  - platform: template
    name: "Langue"
    id: select_language
    icon: mdi:translate
    options:
      - "Français"
      - "English"
    optimistic: true
    on_value:
      - lambda: 'id(language) = (x == "Français") ? 0 : 1;'
      - script.execute: script_lang_refresh

number:
  - platform: template
    name: "Volume"
    id: number_volume
    icon: mdi:volume-high
    min_value: 10
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    optimistic: true
    set_action:
      - lambda: |-
          id(speaker_volume) = x / 100.0f;
          id(es8311_codec).set_volume(id(speaker_volume));
      - lvgl.arc.update:
          id: arc_volume
          value: !lambda 'return (int)x;'
      - lvgl.label.update:
          id: lbl_volume_pct
          text: !lambda 'return to_string((int)x) + "%";'

switch:
  - platform: template
    name: "Ecran tactile"
    id: switch_touchscreen
    icon: mdi:gesture-tap
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
  - platform: template
    name: "Microphone"
    id: switch_microphone
    icon: mdi:microphone
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      - micro_wake_word.start:
          id: mww
    on_turn_off:
      - voice_assistant.stop:
      - micro_wake_word.stop:
          id: mww

# Display ST7701S 480x480 — RGB 16-bit + init via SPI sur TCA9554
display:
  - platform: mipi_rgb
    id: lcd_display
    model: CUSTOM
    cs_pin:
      pca9554: expander
      number: 0
      id: lcd_spi_cs
    data_rate: 1MHz
    data_pins:
      blue:  [40, 41, 42,  2,  1]
      green: [21,  8, 18, 45, 38, 39]
      red:   [10, 11, 12, 13, 14]
    de_pin: GPIO17
    hsync_pin: GPIO46
    vsync_pin: GPIO3
    pclk_pin: GPIO9
    pclk_frequency: 16MHz
    pclk_inverted: false
    pixel_mode: 16bit
    dimensions:
      width: 480
      height: 480
    hsync_pulse_width: 10
    hsync_back_porch: 10
    hsync_front_porch: 20
    vsync_pulse_width: 10
    vsync_back_porch: 10
    vsync_front_porch: 10
    invert_colors: false
    init_sequence:
      - [0x11]
      - [0x29]
