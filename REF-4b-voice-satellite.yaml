# Audio I2S — BCLK=16, WS=7, MCLK=5, DOUT(speaker)=6, DIN(mic)=15
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO16
    i2s_mclk_pin: GPIO5

# ES8311 speaker DAC (I2C 0x18)
audio_dac:
  - platform: es8311
    id: es8311_codec
    i2c_id: bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true

# ES7210 microphone ADC (I2C 0x40)
audio_adc:
  - platform: es7210
    id: es7210_codec
    i2c_id: bus_a
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 33db

microphone:
  - platform: i2s_audio
    id: board_mic
    i2s_audio_id: i2s_bus
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    channel: left

speaker:
  - platform: i2s_audio
    id: board_speaker
    i2s_audio_id: i2s_bus
    i2s_dout_pin: GPIO6
    dac_type: external
    channel: mono

globals:
  - id: language
    type: int
    restore_value: true
    initial_value: '0'  # 0=FR, 1=EN
  - id: speaker_volume
    type: float
    restore_value: true
    initial_value: '0.7'
  - id: ww_threshold
    type: float
    restore_value: true
    initial_value: '0.5'
  - id: screen_timeout_sec
    type: int
    restore_value: true
    initial_value: '60'
  - id: screen_brightness
    type: float
    restore_value: true
    initial_value: '0.8'
  - id: screen_on
    type: bool
    initial_value: 'true'
  - id: last_touch_ms
    type: uint32_t
    initial_value: '0'
  - id: is_listening
    type: bool
    initial_value: 'false'
  - id: anim_val
    type: int
    initial_value: '0'
  - id: anim_dir
    type: int
    initial_value: '1'

script:
